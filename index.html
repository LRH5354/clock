<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时钟</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow: hidden;
    }

    body {
        background: radial-gradient(ellipse at 50% 30%, #1a2540 0%, #0d1320 55%, #06090f 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: "SF Pro Display", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        color: #e2ecfd;
        -webkit-font-smoothing: antialiased;
    }

    /* 微光光斑，营造氛围 */
    body::before {
        content: "";
        position: fixed;
        top: -20%;
        left: 50%;
        transform: translateX(-50%);
        width: 80vw;
        height: 80vw;
        background: radial-gradient(circle, rgba(86, 128, 233, 0.10) 0%, rgba(86, 128, 233, 0) 70%);
        pointer-events: none;
        z-index: 0;
    }

    .clock-wrap {
        position: relative;
        z-index: 1;
        text-align: center;
        width: 100%;
    }

    #timer {
        font-size: 38vh;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums; /* 等宽数字，避免抖动 */
        color: #f3f7ff;
        text-shadow:
            0 0 18px rgba(120, 160, 245, 0.35),
            0 0 50px rgba(86, 128, 233, 0.25);
    }

    #timer span.colon {
        display: inline-block;
        margin: 0 0.06em;
        color: #8fb0ff;
        transition: opacity 0.3s ease;
    }

    #timer span.colon.off {
        opacity: 0;
    }

    .date-line {
        margin-top: 4vh;
        font-size: 9vh;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #c2d2f5;
        font-variant-numeric: tabular-nums;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.45em;
    }

    .date-line .sep {
        color: #5a78b8;
    }

    #weekday {
        font-size: 0.55em;
        font-weight: 500;
        color: #8aa3d8;
        padding: 0.15em 0.5em;
        border: 1px solid rgba(120, 160, 245, 0.25);
        border-radius: 0.6em;
        background: rgba(86, 128, 233, 0.06);
    }

    /* 小屏适配 */
    @media (max-width: 768px) {
        #timer { font-size: 26vh; }
        .date-line { font-size: 7vh; }
    }

</style>
</head>
<body>
    <div class="clock-wrap">
        <div id="timer">00<span class="colon">:</span>00</div>
        <div class="date-line">
            <span id="date">00月00日</span>
            <span class="sep">·</span>
            <span id="weekday">周--</span>
        </div>
    </div>

    <script>
        const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
        const pad = n => String(n).padStart(2, '0');
        let colonOn = true;

        function clock(){
            const now = new Date();
            const hour   = pad(now.getHours());
            const minute = pad(now.getMinutes());
            const month  = pad(now.getMonth() + 1);
            const day    = pad(now.getDate());

            document.getElementById('timer').innerHTML =
                `${hour}<span class="colon ${colonOn ? '' : 'off'}">:</span>${minute}`;

            document.getElementById('date').innerHTML = `${month}月${day}日`;
            document.getElementById('weekday').innerHTML = WEEK[now.getDay()];

            colonOn = !colonOn;
        }

        clock();
        setInterval(clock, 1000);
    </script>
</body>
</html>
